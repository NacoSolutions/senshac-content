- id: documentationwatch-weekly-9ycb22xfhye7
  kind: cron
  cron: '57 2 * * 1'
  role: documentationwatch
  timezone: Europe/Madrid
  prompt: |
    Inspect recent merged changes and their related documentation. Update only concrete, verified documentation drift; keep edits docs-only and run available documentation checks. If documentation is current, report that without committing.
