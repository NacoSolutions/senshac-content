name: Update web content revision

on:
  push:
    branches: [main]
    paths:
      - config/**
      - content/**
      - legal/**
      - pages/**
      - projects/**
      - translations/**
  workflow_dispatch:
    inputs:
      revision:
        description: Reviewed senshac-content commit on main (defaults to the selected commit)
        required: false
        type: string

concurrency:
  group: update-web-content-revision
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-web-pin:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out content history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate content revision
        id: revision
        env:
          REQUESTED_REVISION: ${{ github.event.inputs.revision }}
        run: |
          set -euo pipefail
          revision="${REQUESTED_REVISION:-$GITHUB_SHA}"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${revision}^{commit}"
          git merge-base --is-ancestor "$revision" origin/main
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"

      - name: Mint a web-only GitHub App token
        id: web-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ vars.AUTO_MERGE_APP_ID }}
          private-key: ${{ secrets.AUTO_MERGE_APP_PRIVATE_KEY }}
          owner: NacoSolutions
          repositories: senshac-web
          permission-contents: write
          permission-pull-requests: write

      - name: Check out web repository
        uses: actions/checkout@v4
        with:
          repository: NacoSolutions/senshac-web
          ref: main
          path: senshac-web
          token: ${{ steps.web-token.outputs.token }}
          persist-credentials: false

      - name: Update reviewed content pin
        env:
          CONTENT_REVISION: ${{ steps.revision.outputs.revision }}
        run: node scripts/update-web-content-pin.mjs "$GITHUB_WORKSPACE/senshac-web" "$CONTENT_REVISION"

      - name: Open or update web pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.web-token.outputs.token }}
          path: senshac-web
          branch: automation/tina-content-revision
          delete-branch: true
          commit-message: "chore: update editorial pin to ${{ steps.revision.outputs.revision }}"
          title: "chore: update Tina content revision"
          body: |
            Update the default Pages content pin to `${{ steps.revision.outputs.revision }}`.

            Source: [senshac-content@${{ steps.revision.outputs.revision }}](https://github.com/NacoSolutions/senshac-content/commit/${{ steps.revision.outputs.revision }}).
            Local `SENSHAC_CONTENT_REVISION` overrides remain available.

            Generated by the senshac-content main-branch workflow; Pages deploys after this PR merges.
